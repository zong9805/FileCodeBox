name: 🔄 自动同步上游更新
on:
  schedule:
    # 每天 UTC 时间 2:00 和 14:00 自动运行（北京时间 10:00 和 22:00）
    - cron: '0 2,14 * * *'
  # 也支持手动触发
  workflow_dispatch:
# 设置必要的权限
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史，方便合并
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 🔗 添加上游仓库
        run: |
          git remote add upstream https://github.com/vastsa/FileCodeBox.git
          git fetch upstream
        # 示例：如果你的 fork 来自 torvalds/linux
        # git remote add upstream https://github.com/torvalds/linux.git
      - name: 🔀 合并上游更新到主分支
        run: |
          git checkout main
          git merge upstream/main --no-edit --allow-unrelated-histories
        continue-on-error: true  # 有冲突时不中断
      - name: 📤 推送更新到你的 fork
        run: |
          git push origin main
        continue-on-error: true
      - name: 🚨 检查是否有冲突
        id: check_conflict
        run: |
          if git ls-files -u | grep -q .; then
            echo "conflict=true" >> $GITHUB_OUTPUT
            echo "❌ 检测到合并冲突！需要手动解决。"
          else
            echo "conflict=false" >> $GITHUB_OUTPUT
            echo "✅ 同步完成，无冲突。"
          fi
      - name: 📢 创建冲突通知 Issue（可选）
        if: steps.check_conflict.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ 自动同步上游时出现合并冲突',
              body: '请手动解决冲突后推送。\n\n执行以下命令：\n```bash\ngit pull origin main\n# 解决冲突...\ngit push origin main\n```'
            })
